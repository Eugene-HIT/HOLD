; 创建时间: 2026-05-22
; 文件职责: HOLD 根目录下的 XIAO ESP32S3 点灯测试工程 PlatformIO 构建配置。
; 核心输入输出: 输入为 PlatformIO 构建与烧录命令，输出为适用于 XIAO ESP32S3 的固件镜像与串口日志。
; 最后更改时间: 2026-05-22
; 更改日志:
; - 2026-05-22: 初始化最小点灯测试工程配置。
; - 2026-05-22: 将 PlatformIO 工程入口移动到 HOLD 根目录，便于插件识别与 agent 调用。
; 注意事项:
; - 当前默认板卡 ID 使用 PlatformIO 官方提供的 seeed_xiao_esp32s3。
; - 若后续确认硬件为 XIAO ESP32S3 Plus，可再补充 Flash 容量与分区配置。

[platformio]
default_envs = xiao_esp32s3_blink

[env:xiao_esp32s3_blink]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
