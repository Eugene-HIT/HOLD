; 创建时间: 2026-05-22
; 文件职责: HOLD 根目录下的 XIAO ESP32S3 点灯测试工程 PlatformIO 构建配置。
; 核心输入输出: 输入为 PlatformIO 构建与烧录命令，输出为适用于 XIAO ESP32S3 的固件镜像与串口日志。
; 最后更改时间: 2026-05-22
; 更改日志:
; - 2026-05-22: 初始化最小点灯测试工程配置。
; - 2026-05-22: 将 PlatformIO 工程入口移动到 HOLD 根目录，便于插件识别与 agent 调用。
; - 2026-06-05: 新增 MR60BHA2 + XIAO ESP32C6 独立教程复现环境，避免影响现有 S3 主工程。
; - 2026-06-05: MR60BHA2 环境切换到 pioarduino 稳定平台，以支持 ESP32-C6 Arduino framework。
; - 2026-06-06: 新增 MPU6050 + XIAO ESP32S3 独立探针环境，用于新模块好坏与原始数据读取验证。
; - 2026-06-06: 将 ESP32S3 相关环境固定到本机已安装的 espressif32@6.13.0，绕开当前自动安装工具链卡住问题。
; - 2026-06-08: 新增单 IMU 呼吸与运动状态实验环境，保留原始探针程序不变。
; - 2026-06-09: 新增 MAX30102 独立 VOFA 对比环境，用于手指与胸前位点的 8 通道波形展示。
; - 2026-06-11: 新增 DRV2605L + LRA 独立呼吸震动实验环境，用于深呼吸节律反馈验证。
; 注意事项:
; - 当前默认板卡 ID 使用 PlatformIO 官方提供的 seeed_xiao_esp32s3。
; - 若后续确认硬件为 XIAO ESP32S3 Plus，可再补充 Flash 容量与分区配置。
; - MR60BHA2 环境仅用于先复现 Seeed 官方 Arduino 教程，后续再决定是否并入主工程。

[platformio]
default_envs = xiao_esp32s3_blink

[env:xiao_esp32s3_blink]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
build_src_filter =
    +<*>
    -<mr60bha2_xiao_c6_demo/>
    -<mpu6050_xiao_esp32s3_probe/>
    -<mpu6050_xiao_esp32s3_respiration/>

[env:mr60bha2_xiao_c6_demo]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/Love4yzp/Seeed-mmWave-library.git
build_src_filter =
    -<*>
    +<mr60bha2_xiao_c6_demo/>

[env:mpu6050_xiao_esp32s3_probe]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
build_src_filter =
    -<*>
    +<mpu6050_xiao_esp32s3_probe/>

[env:mpu6050_xiao_esp32s3_respiration]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
